# Render Blueprint Configuration for CascadeGuard FastAPI Backend
services:
  - type: web
    name: cascadeguard-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
        value: http://localhost:3000
